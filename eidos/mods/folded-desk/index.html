<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>折页工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#24252d;color:#eee8da;font:15px/1.7 system-ui}main{height:100dvh;overflow:auto;padding:clamp(18px,4vw,38px);background:radial-gradient(ellipse at 90% 10%,#805b4933,transparent 60%)}header{border-bottom:1px solid #b8a48866;display:flex;align-items:center;justify-content:space-between}h1{font:30px Georgia,serif;margin:0 0 12px}h2{font-size:15px;font-weight:500;color:#d8cdb8}p{color:#bab6ad}button,select,input,textarea{font:inherit;border:1px solid #847665;color:#eee8da;background:#25252c;padding:8px 12px;border-radius:4px}button{cursor:pointer}button:hover{background:#50483d}button:disabled{opacity:.45;cursor:wait}textarea{width:100%;min-height:110px;resize:vertical}input{max-width:100%}.columns{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:24px}.columns>section{border-bottom:1px solid #b8a48844;padding-bottom:22px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.status{color:#c9dabe;white-space:pre-wrap}small{color:#a1a39d}.row{display:flex;gap:8px;align-items:center;margin-bottom:12px}.drop{padding:20px;border:1px dashed #a5a08c;margin-top:12px}.drop input{width:100%}[role=alert]{color:#ffbcaa}@media(max-width:600px){.columns{grid-template-columns:1fr;gap:12px}h1{font-size:25px}.row{flex-wrap:wrap}}
</style></head><body><main><header><h1>折页工作台</h1><small>把字寄往远岸</small></header><p>你可以在这里寄出一封信、修补一句规则，或用一段记忆换一张渡票。纸窗与文件是实际可操作的对象。</p><p role="alert" data-error></p><p class="status" data-message></p><div class="columns">
<section><h2>01 / 分支邮局</h2><textarea data-letter aria-label="信件内容">给另一个选择之后的自己：别忘了北岸的灯。</textarea><div class="actions"><button data-save>保存信件</button><button data-open>打开信件纸窗</button><button data-publish>寄到另一分支</button><button data-receive>收取已寄的信</button><button data-export>导出信件</button></div><p>在世界线回溯并继续另一条分支后，仍能收取明确寄出的这封信。</p><div class="actions"><button data-native hidden>独立桌面纸窗</button><button data-checkout hidden>写入工作目录</button><button data-reload hidden>重新载入外部修改</button></div></section>
<section><h2>02 / 折页接岸</h2><p>打开两扇纸窗，移动标题栏使它们对齐。窄屏可用“对齐”完成同样的操作。</p><div class="actions"><button data-fold>展开两岸</button><button data-align>对齐纸窗</button></div><p class="status" data-fold-status>两岸尚未相接。</p></section>
<section><h2>03 / 法则修理与记忆交换</h2><div class="row"><select data-rule aria-label="当地通行规则"><option>桥允许步行</option><option>桥只允许持票者</option></select><button data-rule-save>修补规则</button><button data-cross>尝试过桥</button></div><p data-memory></p><div class="actions"><button data-trade>用这段记忆换渡票</button></div><small>这里交换的记忆只属于这张工作台中的角色。</small></section>
<section class="drop" data-drop><h2>04 / 材料台</h2><p>选取或拖入文本、图片、PDF。导入保存原件；点击分析才请求 UZQ，重复相同问题复用已完成结果。</p><input type="file" data-file aria-label="递交材料"><input data-task value="描述材料中可直接观察到的信息，区分推断。" aria-label="材料处理任务"><div class="actions"><button data-inspect>交给 UZQ 分析</button><button data-cancel>取消分析</button></div><p class="status" data-analysis></p></section>
</div><div class="actions"><button data-story>将最近操作交给正文</button></div><p class="status" data-log></p></main><script>
(function(){var sdk=window.Eidos,ctx=null,state=null,path='远岸.txt',version=null,material=null,pending=false,activeScope='';
var $=function(s){return document.querySelector(s)};
function report(value){$('[data-message]').textContent=value}
function note(line){state=Object.assign({},state,{log:(state.log||[]).concat(line).slice(-12)});sdk.setState(state);$('[data-log]').textContent=state.log.join('\n')}
async function run(fn){if(pending||ctx?.reading.loading||ctx?.reading.paused||ctx?.surface?.active===false)return;pending=true;render();$('[data-error]').textContent='';try{await fn()}catch(e){$('[data-error]').textContent=e.message}finally{pending=false;render()}}
async function decision(line,changes){var next=Object.assign({},state,changes||{},{log:(state.log||[]).concat(line).slice(-12)});if(sdk.gameplay){var facts={rule:next.rule,ticket:next.ticket,memory:next.memory,crossed:next.crossed===true,aligned:next.aligned===true,lastDecision:line};var receipt=await sdk.gameplay.commit({summary:line,state:next,facts:facts,narrate:false});state=Object.assign({},next,{_eidosGameplay:{revision:receipt.revision,facts:facts,last:receipt}});if(receipt.persistence!=='saved')report('决定已确认，请先重试保存。');}else{state=next;sdk.setState(next);}render()}
async function save(){var ref=await sdk.files.write(path,$('[data-letter]').value,{expectedVersion:version});version=ref.id;return ref}
async function read(){var resource=await sdk.files.read(path);version=resource.id;$('[data-letter]').value=resource.text||'';return resource}
function editor(){return '<!doctype html><meta charset="utf-8"><style>body{margin:0;padding:18px;background:var(--eidos-paper,#faf9f6);color:var(--eidos-ink,#202124);font:14px/1.8 var(--font-geist-sans,system-ui)}textarea{width:100%;height:130px;background:var(--eidos-surface,#fff);color:inherit;border:1px solid color-mix(in srgb,currentColor 18%,transparent);padding:8px;box-sizing:border-box}button{margin-top:10px;padding:8px;background:transparent;color:var(--eidos-accent,#9e0000);border:1px solid currentColor;border-radius:3px;min-height:36px}p{font-size:12px}</style><h3>远岸的信</h3><textarea aria-label="辅助纸窗信件"></textarea><button>保存这封信</button><p></p><script>var v=null,loaded=false;Eidos.onContext(async function(c){if(loaded)return;loaded=true;try{var f=await Eidos.files.read("远岸.txt");v=f.id;document.querySelector("textarea").value=f.text}catch(e){document.querySelector("p").textContent=e.message}});document.querySelector("button").onclick=async function(){try{var f=await Eidos.files.write("远岸.txt",document.querySelector("textarea").value,{expectedVersion:v});v=f.id;document.querySelector("p").textContent="已保存"}catch(e){document.querySelector("p").textContent=e.message}};<\/script>'}
async function open(mode){await save();await sdk.stages.open({id:'letter',title:'远岸的信',html:editor(),width:390,height:300,mode:mode});note('打开了'+(mode==='native'?'独立桌面':'宿主内')+'信件纸窗。')}
$('[data-save]').onclick=function(){run(async function(){await save();note('信件已保存。')})};
$('[data-open]').onclick=function(){run(function(){return open('embedded')})};$('[data-native]').onclick=function(){run(function(){return open('native')})};
$('[data-publish]').onclick=function(){run(async function(){await save();await sdk.files.publish(path,'letter');note('信已寄出，之后的其他分支可以收取。')})};
$('[data-receive]').onclick=function(){run(async function(){var mail=await sdk.files.receive('letter',path,version);await read();note('收到另一分支寄来的信。')})};
$('[data-export]').onclick=function(){run(async function(){await save();await sdk.files.export(path);report('已请求下载信件。')})};
$('[data-checkout]').onclick=function(){run(async function(){await save();var r=await sdk.files.checkout(path);report('工作目录：'+r.directory);note('信件已写入模组工作目录。')})};
$('[data-reload]').onclick=function(){run(async function(){await sdk.files.reload(path);await read();note('已重新载入工作文件。')})};
$('[data-fold]').onclick=function(){run(async function(){await sdk.stages.open({id:'bank-a',title:'北岸切口',html:'<body style="background:var(--eidos-paper,#faf9f6);color:var(--eidos-ink,#202124);font:24px/1.8 var(--font-geist-sans,system-ui);padding:30px">北　岸<br>切口 →</body>',x:30,y:30,width:220,height:180});await sdk.stages.open({id:'bank-b',title:'南岸切口',html:'<body style="background:var(--eidos-paper,#faf9f6);color:var(--eidos-ink,#202124);font:24px/1.8 var(--font-geist-sans,system-ui);padding:30px">南　岸<br>← 切口</body>',x:280,y:110,width:220,height:180});note('两张岸的纸窗已展开。')})};
$('[data-align]').onclick=function(){run(async function(){var list=await sdk.stages.list(),a=list.find(function(s){return s.id==='bank-a'}),b=list.find(function(s){return s.id==='bank-b'});if(!a||!b)throw new Error('先展开两岸。');await sdk.stages.update({id:b.id,x:a.x,y:a.y});await decision('两岸的纸窗已对齐。',{aligned:true})})};
$('[data-rule-save]').onclick=function(){var rule=$('[data-rule]').value;run(function(){return decision('当地规则修补为：'+rule,{rule:rule})})};
$('[data-cross]').onclick=function(){run(function(){var crossed=state.rule==='桥允许步行'||state.ticket;return decision(crossed?'按当前规则，你实际通过了桥。':'桥要求渡票，这次没能通过。',{crossed:crossed})})};
$('[data-trade]').onclick=function(){if(!state.memory)return;run(function(){return decision('交出祖母教读信的记忆，换到渡票。这段记忆已离开本模组角色。',{memory:'',ticket:true})})};
async function ingest(file){await run(async function(){material='材料/'+file.name;await sdk.resources.import(material,file);note('保存了原始材料：'+file.name);$('[data-analysis]').textContent='原件已保存，尚未分析。'})}
$('[data-file]').onchange=function(e){if(e.target.files[0])ingest(e.target.files[0])};$('[data-drop]').ondragover=function(e){e.preventDefault()};$('[data-drop]').ondrop=function(e){e.preventDefault();if(e.dataTransfer.files[0])ingest(e.dataTransfer.files[0])};
$('[data-inspect]').onclick=function(){run(async function(){if(!material)throw new Error('请先递交材料。');$('[data-analysis]').textContent='UZQ 正在处理…';var result=await sdk.resources.inspect(material,$('[data-task]').value);$('[data-analysis]').textContent=(result.cached?'复用结果：\n':'UZQ：\n')+result.content;note('已获得材料分析结果；结果不是世界状态操作。')})};
$('[data-cancel]').onclick=function(){sdk.resources.cancel().catch(function(e){$('[data-error]').textContent=e.message})};
$('[data-story]').onclick=function(){if(pending||ctx.reading.loading||ctx.reading.paused||!state.log.length)return;var last=state._eidosGameplay?.last;if(last&&sdk.gameplay){run(function(){return sdk.gameplay.narrate(last.id)});return;}sdk.submit('《折页工作台》最近实际操作：'+state.log.slice(-3).join(' ')+' 请承接这些事实，不编造其他操作。',state)};
function render(){if(!state)return;$('[data-story]').disabled=pending||Boolean(ctx?.reading.loading||ctx?.reading.paused)||!state.log.length;$('[data-memory]').textContent=state.memory?'可交易的记忆：'+state.memory:'这段记忆已离开角色。渡票仍在。';$('[data-trade]').disabled=!state.memory;$('[data-rule]').value=state.rule||'桥允许步行';$('[data-log]').textContent=(state.log||[]).join('\n');var w=ctx.state._eidosWorkspace||{},a=(w.stages||[]).find(function(s){return s.id==='bank-a'}),b=(w.stages||[]).find(function(s){return s.id==='bank-b'});$('[data-fold-status]').textContent=a&&b&&Math.abs(a.x-b.x)<20&&Math.abs(a.y-b.y)<20?(state.aligned?'两岸相接：纸上的渡口已经打开。':'纸窗已对齐，尚未确认接岸。'):'两岸尚未相接。';var caps=sdk.capabilities();$('[data-native]').hidden=!caps.nativeWindows;$('[data-checkout]').hidden=!caps.nativeDirectory;$('[data-reload]').hidden=!caps.nativeDirectory;}
sdk.onEvent(function(e){if(e.type==='file_written'&&e.path===path)read().catch(function(){})});
sdk.onContext(function(c){ctx=c;state=c.state;render();if(activeScope!==c.scope){activeScope=c.scope;version=(c.state._eidosWorkspace||{}).files?.[path]?.id||null;var files=(c.state._eidosWorkspace||{}).files||{};material=Object.keys(files).find(function(p){return p.startsWith('材料/')})||null;if(version)read().catch(function(){})}});
})();</script></body></html>
