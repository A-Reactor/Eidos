<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雾灯审判：借来的回声</title>
  <style>
    :root { color-scheme: dark; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; background: #101718; color: #edf0e8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: radial-gradient(ellipse at 18% 2%, #344144 0, transparent 38%), linear-gradient(145deg, #11191a, #182021 58%, #101617); }
    button, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    #mod-root { --paper: #e4deca; --ink: #252d2b; --muted: #aebbb3; --line: rgba(224, 230, 216, .14); width: min(1440px, 100%); margin: 0 auto; padding: clamp(14px, 2.3vw, 32px); }
    .masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 4px 0 20px; border-bottom: 1px solid var(--line); }
    .eyebrow, .micro { color: #91afa0; font-size: 10px; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; }
    h1 { margin: 7px 0 5px; color: #f1eedf; font-family: Georgia, "Songti SC", serif; font-size: clamp(25px, 3.4vw, 40px); font-weight: 500; letter-spacing: .04em; }
    .subtitle { margin: 0; color: #bcc6bb; font-size: 13px; }
    .world-mark { flex: 0 0 auto; min-width: 130px; padding: 11px 14px; border: 1px solid rgba(187, 211, 190, .23); border-radius: 4px; color: #d8dfd3; font-size: 12px; text-align: right; }
    .world-mark strong { display: block; margin-top: 4px; color: #9fc5ad; font-family: Georgia, serif; font-size: 14px; font-weight: 500; }
    .reading-strip { display: grid; grid-template-columns: 130px 1fr auto; align-items: center; gap: 14px; margin: 17px 0 18px; padding: 12px 15px; border-left: 2px solid #b7945c; background: rgba(232, 225, 201, .06); }
    .reading-strip p { margin: 0; color: #d4d8ce; font-family: Georgia, "Songti SC", serif; font-size: 13px; line-height: 1.65; }
    .quiet-button, .tab, .action-button, .choice-button { border: 1px solid var(--line); border-radius: 3px; background: rgba(225, 231, 216, .045); transition: background .16s ease, border-color .16s ease, transform .16s ease; }
    .quiet-button:hover, .tab:hover, .action-button:hover, .choice-button:hover { border-color: rgba(171, 205, 180, .55); background: rgba(150, 191, 162, .12); }
    .quiet-button { padding: 8px 11px; color: #c8d4ca; font-size: 11px; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.22fr) minmax(300px, .78fr); align-items: start; gap: 18px; }
    .main-column, .side-column { display: grid; align-content: start; gap: 14px; min-width: 0; }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: rgba(20, 28, 28, .78); box-shadow: 0 12px 36px rgba(0, 0, 0, .12); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 15px; border-bottom: 1px solid var(--line); }
    .panel-head h2, .panel-head h3 { margin: 0; color: #e8e4d5; font-family: Georgia, "Songti SC", serif; font-size: 16px; font-weight: 500; letter-spacing: .04em; }
    .panel-body { padding: 15px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
    .tab { padding: 7px 10px; color: #b7c2b9; font-size: 11px; }
    .tab[aria-current="page"] { border-color: rgba(183, 148, 92, .65); background: rgba(183, 148, 92, .13); color: #f0d9a9; }
    .scene-intro { padding: 18px 18px 15px; border-bottom: 1px solid var(--line); background: linear-gradient(120deg, rgba(162, 183, 160, .09), transparent 72%); }
    .scene-intro .micro { margin-bottom: 8px; color: #d0ad71; }
    .scene-intro p { max-width: 70ch; margin: 0; color: #d5d8cd; font-family: Georgia, "Songti SC", serif; font-size: 15px; line-height: 1.9; }
    .scene-copy { color: #bac5bc; font-size: 12px; line-height: 1.8; }
    .scene-copy p { margin: 0 0 10px; }
    .scene-copy p:last-child { margin-bottom: 0; }
    .callout { margin: 12px 0; padding: 10px 12px; border-left: 2px solid #779981; background: rgba(119, 153, 129, .08); color: #d6dfd5; font-size: 12px; line-height: 1.75; }
    .character-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .character-card { padding: 11px 12px; border: 1px solid var(--line); background: rgba(239, 237, 218, .025); }
    .character-card h4 { margin: 0; color: #e8d4ac; font-size: 13px; font-weight: 600; }
    .character-card .role { margin: 4px 0 8px; color: #84988c; font-size: 10px; }
    .character-card p { margin: 0; color: #c2ccc2; font-size: 11px; line-height: 1.65; }
    .character-card .daily { margin-top: 8px; color: #aab7ad; }
    .section-label { margin: 0 0 10px; color: #9cafa1; font-size: 10px; font-weight: 800; letter-spacing: .12em; }
    .ability-card { display: grid; grid-template-columns: minmax(100px, .36fr) 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .ability-card:first-child { padding-top: 0; border-top: 0; }
    .ability-card h4 { margin: 0 0 5px; color: #e7d3a9; font-size: 13px; font-weight: 600; }
    .ability-card p { margin: 0; color: #b9c5bb; font-size: 11px; line-height: 1.7; }
    .ability-label { margin-top: 8px !important; color: #d9bb86 !important; }
    .clue-list, .testimony-list { display: grid; gap: 8px; }
    .clue-item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 7px 10px; padding: 10px; border: 1px solid var(--line); background: rgba(239, 237, 218, .022); }
    .clue-item.is-found { border-color: rgba(128, 172, 137, .32); background: rgba(91, 130, 101, .075); }
    .clue-item strong { display: block; color: #dfe5d9; font-size: 11px; font-weight: 600; }
    .clue-item small { display: block; margin-top: 4px; color: #829488; font-size: 10px; }
    .clue-item .detail { grid-column: 1 / -1; margin: 0; padding-top: 8px; border-top: 1px dashed var(--line); color: #c6d0c5; font-size: 11px; line-height: 1.7; }
    .action-button { padding: 7px 9px; color: #c6d8c8; font-size: 10px; white-space: nowrap; }
    .action-button.primary { border-color: rgba(181, 145, 89, .52); background: rgba(181, 145, 89, .14); color: #f0d4a2; }
    .action-button[disabled] { cursor: default; opacity: .48; }
    .testimony-card { padding: 12px; border: 1px solid var(--line); background: rgba(239, 237, 218, .022); }
    .testimony-card.is-selected { border-color: rgba(183, 148, 92, .57); background: rgba(183, 148, 92, .07); }
    .testimony-card .speaker { margin: 0 0 7px; color: #d6b77c; font-size: 10px; }
    .testimony-card blockquote { margin: 0; color: #e0e3d9; font-family: Georgia, "Songti SC", serif; font-size: 12px; line-height: 1.7; }
    .testimony-card .challenge-note { margin: 9px 0 0; color: #9fc0a5; font-size: 10px; line-height: 1.6; }
    .present-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .status-line { min-height: 36px; margin: 0; padding: 9px 11px; border: 1px solid rgba(203, 181, 130, .2); background: rgba(164, 132, 75, .06); color: #d9c99f; font-size: 11px; line-height: 1.6; }
    .person-row { padding: 12px 0; border-top: 1px solid var(--line); }
    .person-row:first-child { padding-top: 0; border-top: 0; }
    .person-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .person-line strong { color: #e7e2d3; font-size: 12px; }
    .person-line .hint { color: #8da194; font-size: 10px; }
    .person-row p { margin: 6px 0 9px; color: #aebbaf; font-size: 10px; line-height: 1.6; }
    .binding-row { display: flex; align-items: center; gap: 7px; margin-top: 8px; color: #8fa397; font-size: 10px; }
    .binding-row select { min-width: 0; max-width: 170px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 3px; background: #1a2523; color: #d4dfd4; font-size: 10px; }
    .suspect-button { padding: 5px 8px; border: 1px solid rgba(206, 174, 120, .24); border-radius: 3px; background: transparent; color: #c8b88e; font-size: 10px; }
    .suspect-button[aria-pressed="true"] { border-color: #d2ae72; background: rgba(210, 174, 114, .16); color: #f3d7a4; }
    .evidence-count { color: #819589; font-size: 10px; }
    .result-card { padding: 14px; border: 1px solid rgba(124, 169, 132, .34); background: rgba(85, 130, 95, .09); }
    .result-card h3 { margin: 0 0 8px; color: #c2d9bd; font-family: Georgia, "Songti SC", serif; font-size: 16px; font-weight: 500; }
    .result-card p { margin: 0; color: #c4d0c2; font-size: 11px; line-height: 1.75; }
    .privacy-choices { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .choice-button { padding: 8px 10px; color: #d6c89e; font-size: 10px; }
    .choice-button.safe { border-color: rgba(126, 175, 135, .45); color: #b6d6bc; }
    .private-reveal { margin-top: 12px !important; padding: 10px; border: 1px solid rgba(189, 146, 91, .32); background: rgba(181, 139, 84, .07); color: #e4cfaa !important; }
    .footnote { margin: 0; color: #77887e; font-size: 10px; line-height: 1.65; }
    .empty-note { padding: 10px; color: #8fa196; font-size: 10px; line-height: 1.7; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .side-column { grid-template-columns: repeat(2, minmax(0, 1fr)); } .side-column .panel:first-child { grid-column: 1 / -1; } }
    @media (max-width: 560px) { #mod-root { padding: 12px; } .masthead { gap: 10px; } .world-mark { min-width: 94px; padding: 8px; font-size: 10px; } .reading-strip { grid-template-columns: 1fr auto; gap: 8px; } .reading-strip .micro { grid-column: 1 / -1; } .character-grid, .side-column { grid-template-columns: 1fr; } .side-column .panel:first-child { grid-column: auto; } .ability-card { grid-template-columns: 1fr; gap: 5px; } }
  </style>
</head>
<body>
  <main id="mod-root" data-trial-stage aria-live="polite"></main>
  <script>
    (() => {
      'use strict';
      const root = document.getElementById('mod-root');
      const freshState = {
        screen: 'scene', foundClues: [], selectedTestimony: '', challengedStatements: [],
        suspicion: '', verdict: 'open', verdictFor: '', privacyChoice: '', bindings: {}, message: '你可以先陪他们吃完一顿晚饭，也可以直接检查现场。怀疑随时能改，判决需要证据。'
      };
      let context = null;
      let state = clone(freshState);
      let hydrated = false;
      let pendingCommit = false;
      let acceptedState = clone(state);

      function clone(value) { return JSON.parse(JSON.stringify(value)); }
      function asText(value) { return value == null ? '' : String(value); }
      function escapeHtml(value) {
        return asText(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
      }
      function data() { return context?.plugin?.data || {}; }
      function cast() { return Array.isArray(data().cast) ? data().cast : []; }
      function person(id) { return cast().find(entry => entry.id === id); }
      function personName(id) { return state.bindings?.[id] || person(id)?.name || id || '未知角色'; }
      function format(value) {
        return asText(value).replace(/\{([a-z0-9_-]+)\}/gi, (_match, id) => id === 'victim' ? (data().case?.victimName || '遇难者') : personName(id));
      }
      function clue(id) { return (Array.isArray(data().clues) ? data().clues : []).find(entry => entry.id === id); }
      function testimony(id) { return (Array.isArray(data().testimonies) ? data().testimonies : []).find(entry => entry.id === id); }
      function found(id) { return Array.isArray(state.foundClues) && state.foundClues.includes(id); }
      function challenged(id) { return Array.isArray(state.challengedStatements) && state.challengedStatements.includes(id); }
      function sync() {
        acceptedState = clone(state);
        if (window.Eidos?.setState) window.Eidos.setState(clone(state));
      }
      function submit(action) {
        if (window.Eidos?.submit) window.Eidos.submit(action, clone(state));
      }
      function factsFor(next) {
        return {
          caseTitle: format(data().case?.title || ''),
          phase: next.privacyChoice ? 'ending' : next.verdict === 'resolved' ? 'aftermath' : next.foundClues.length ? 'investigation' : 'daily',
          foundClues: (next.foundClues || []).map(id => clue(id)).filter(Boolean).map(item => ({ id: item.id, title: format(item.title), detail: format(item.detail) })),
          challengedStatements: next.challengedStatements || [], suspicion: next.suspicion,
          verdict: next.verdict, verdictFor: next.verdictFor, privacyChoice: next.privacyChoice,
          ...(next.privacyChoice === 'quoted' ? { quotedLetter: format(data().privateLetter?.text || '') } : {}),
          currentResult: next.message
        };
      }
      function mark(message, action, narrate = false) {
        state.message = message;
        if (!action || !window.Eidos?.gameplay) { sync(); if (action) submit(action); render(); return; }
        const next = clone(state), facts = factsFor(next), events = [];
        if (next.challengedStatements.length > (acceptedState.challengedStatements || []).length) events.push({ pluginId: context.plugin.id, ruleId: 'trial-claim-tested' });
        if (next.foundClues.includes('echo-test') && !(acceptedState.foundClues || []).includes('echo-test')) events.push({ pluginId: context.plugin.id, ruleId: 'echo-limit-tested' });
        if (action.startsWith('和') && action.includes('日常')) events.push({ pluginId: context.plugin.id, ruleId: 'daily-routine-noticed' });
        state = clone(acceptedState); pendingCommit = true; render();
        window.Eidos.gameplay.commit({ summary: action, state: next, facts, events, narrate }).then(receipt => {
          state = { ...next, _eidosGameplay: { revision: receipt.revision, facts, last: receipt } };
          acceptedState = clone(state); pendingCommit = false; render();
          if (narrate && receipt.persistence === 'saved') return window.Eidos.gameplay.narrate(receipt.id);
        }).catch(error => {
          pendingCommit = false; state = clone(acceptedState);
          state.message = error.message || '这次操作尚未确认，请重试。'; render();
        });
      }
      function list(items, renderItem, empty) {
        return items.length ? items.map(renderItem).join('') : `<p class="empty-note">${escapeHtml(empty)}</p>`;
      }
      function button(action, id, label, className = 'action-button') {
        return `<button class="${className}" type="button" data-action="${escapeHtml(action)}" data-id="${escapeHtml(id)}">${label}</button>`;
      }
      function renderScene() {
        const scene = data().case || {};
        const reading = asText(context?.reading?.displayedText).trim() || format(scene.opening || '宿舍的夜灯亮着。你可以从正在发生的生活开始，也可以先去查看案发现场。');
        const people = cast();
        return `<section class="panel">
          <div class="scene-intro"><div class="micro">今夜 · ${escapeHtml(format(scene.scene || data().setting?.name || '共同生活'))}</div><p>${escapeHtml(reading)}</p></div>
          <div class="panel-head"><h2>一顿没有吃完的晚饭</h2><span class="micro">RELATIONSHIP / BEFORE THE TRIAL</span></div>
          <div class="panel-body">
            <div class="scene-copy"><p>${escapeHtml(format(data().setting?.description || '这栋宿舍里，住客轮流照看彼此。'))}</p><p>在证物变成指控之前，先记住他们怎样照料彼此。你可以选一段日常写进世界记录，也可以离开餐桌继续调查。</p></div>
            <div class="character-grid">${people.map(entry => `<article class="character-card"><h4>${escapeHtml(personName(entry.id))}</h4><p class="role">${escapeHtml(format(entry.role || '宿舍住客'))}</p><p>${escapeHtml(format(entry.connection || '你们之间有一段尚待了解的关系。'))}</p><p class="daily">${escapeHtml(format(entry.daily || '这段日常还没有写下。'))}</p>${button('daily', entry.id, '记下这段照料', 'action-button')}</article>`).join('')}</div>
            <div class="callout">如果你还不想审判任何人，可以继续和他们相处。这里没有倒数计时；改变怀疑不会抹掉已经找到的证物。</div>
          </div>
        </section>`;
      }
      function renderAbilities() {
        const people = cast();
        return `<section class="panel"><div class="panel-head"><h2>能力的边界</h2><span class="micro">TEST THE CLAIM, NOT THE PERSON</span></div><div class="panel-body">
          <p class="scene-copy">传闻会把能力说得很完整，实际能力总有触发条件。你可以阅读人物自己的描述，再去找能复现、能质疑的材料。</p>
          ${people.map(entry => `<article class="ability-card"><div><h4>${escapeHtml(format(entry.ability?.name || '未命名能力'))}</h4><p>${escapeHtml(personName(entry.id))} · ${escapeHtml(format(entry.role || ''))}</p></div><div><p>${escapeHtml(format(entry.ability?.description || '尚无已知触发方式。'))}</p><p class="ability-label">已知限制：${escapeHtml(format(entry.ability?.limits || '仍待调查'))}</p></div></article>`).join('')}
          <div class="callout">一项能力可以产生线索，也可能制造误解。先确认它能做什么，再判断线索能证明什么。</div>
          ${button('inspect', 'echo-test', '去铜铃边复现余响', 'action-button primary')}
        </div></section>`;
      }
      function renderEvidenceScreen() {
        return `<section class="panel"><div class="panel-head"><h2>沿着宿舍走一圈</h2><span class="micro">自由调查 · 不必按顺序</span></div><div class="panel-body">
          <p class="scene-copy">每个地点都可能留下日常痕迹，也可能只给你一个新的问题。打开一件证物后，右侧会保留它的发现记录。</p>
          <div class="clue-list">${renderClues()}</div>
        </div></section>`;
      }
      function renderTrial() {
        const current = state.selectedTestimony;
        const statements = Array.isArray(data().testimonies) ? data().testimonies : [];
        const resolved = state.verdict === 'resolved';
        const suspected = person(state.suspicion);
        const resolution = data().resolution || {};
        const result = resolved ? `<div class="result-card"><h3>审判记录 · ${escapeHtml(personName(state.verdictFor))}</h3><p>${escapeHtml(format(resolution.finding || '具体证词与现场材料构成了可核对的证据链。'))}</p>
          ${state.privacyChoice === 'anonymous' ? `<p class="private-reveal">${escapeHtml(format(data().privateLetter?.anonymousFact || '你提交了不包含私信原句的匿名事实。'))} 你没有公开私信内容。</p>` : ''}
          ${state.privacyChoice === 'quoted' ? `<p class="private-reveal">${escapeHtml(format(data().privateLetter?.text || '没有可公开的私信原句。'))}</p>` : ''}
          ${!state.privacyChoice ? `<p>原信内容可以匿名保护。定罪依据不需要公开它。</p><div class="privacy-choices">${button('protect-secret', '', '匿名提交 · 保留隐私', 'choice-button safe')}${button('publish-secret', '', '公开原句', 'choice-button')}</div>` : ''}
        </div>` : `<div class="callout">${escapeHtml(suspected ? `当前怀疑：${personName(suspected.id)}。你随时可以改。` : '还没有选定怀疑对象。怀疑只是一个待查方向。')} 选中一条具体证词，再出示你已找到的证物；没有直接对应关系时，审判会保持开放。</div>`;
        return `<section class="panel"><div class="panel-head"><h2>审判桌</h2><span class="micro">DOUBT IS NOT PROOF</span></div><div class="panel-body">
          <p class="scene-copy">可以先怀疑，再推翻自己的猜测。只有具体证物能对应具体证词，且关键因果链成立时，这里才会记录定罪。错误判断会退回调查，不会封死其他路线。</p>
          <div class="testimony-list">${statements.map(entry => `<article class="testimony-card ${current === entry.id ? 'is-selected' : ''}"><p class="speaker">${escapeHtml(personName(entry.personId))} · ${challenged(entry.id) ? '已被具体证物质询' : '待核对'}</p><blockquote>「${escapeHtml(format(entry.text))}」</blockquote>${challenged(entry.id) ? `<p class="challenge-note">${escapeHtml(format(entry.challenge || '这条证词已经和一件证物对照。'))}</p>` : button('testimony', entry.id, '选中这条证词')}</article>`).join('')}</div>
          ${current && !resolved ? `<div class="present-row">${(Array.isArray(state.foundClues) ? state.foundClues : []).map(id => clue(id)).filter(Boolean).map(entry => button('present', entry.id, `出示：${escapeHtml(format(entry.title))}`)).join('') || '<p class="empty-note">先发现一件证物，再来质询这句话。</p>'}</div>` : ''}
          <p class="status-line" role="status">${escapeHtml(state.message || '证物和证词还没有形成可以核对的关系。')}</p>
          ${!resolved ? `<div class="privacy-choices">${button('convict', '', `提交定罪判断${suspected ? ` · ${escapeHtml(personName(suspected.id))}` : ''}`, 'action-button primary')}<span class="footnote">证据不足时可以继续调查；这不会结束案件。</span></div>` : ''}
          ${result}
        </div></section>`;
      }
      function renderClues() {
        const clues = Array.isArray(data().clues) ? data().clues : [];
        return clues.map(entry => `<article class="clue-item ${found(entry.id) ? 'is-found' : ''}"><div><strong>${escapeHtml(format(entry.title))}</strong><small>${escapeHtml(format(entry.place || '宿舍内'))} · ${found(entry.id) ? '已记录' : '尚待查看'}</small></div>${found(entry.id) ? '<span class="micro">FOUND</span>' : button('inspect', entry.id, '查看')}${found(entry.id) ? `<p class="detail">${escapeHtml(format(entry.detail || '这件证物尚无说明。'))}</p>` : ''}</article>`).join('');
      }
      function renderPeople() {
        const names = Array.isArray(context?.characters) ? context.characters.filter(name => typeof name === 'string') : [];
        return cast().map(entry => {
          const options = [...new Set([entry.name, ...names].filter(Boolean))];
          const selected = state.bindings?.[entry.id] || entry.name;
          return `<div class="person-row"><div class="person-line"><strong>${escapeHtml(personName(entry.id))}</strong><button type="button" class="suspect-button" data-action="suspect" data-id="${escapeHtml(entry.id)}" aria-pressed="${state.suspicion === entry.id}">${state.suspicion === entry.id ? '当前怀疑' : '暂列怀疑'}</button></div><p>${escapeHtml(format(entry.connection || entry.role || '尚无关系记录'))}</p><label class="binding-row">对应本世界角色<select data-bind="${escapeHtml(entry.id)}"><option value="${escapeHtml(entry.name)}">模组角色：${escapeHtml(entry.name)}</option>${names.map(name => `<option value="${escapeHtml(name)}" ${selected === name ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}</select></label></div>`;
        }).join('');
      }
      function render() {
        root.setAttribute('aria-busy', String(pendingCommit));
        if (!root || !context) return;
        const screens = [
          ['scene', '日常关系'], ['abilities', '能力边界'], ['evidence', '现场调查'], ['trial', '审判桌']
        ];
        const screen = screens.some(([id]) => id === state.screen) ? state.screen : 'scene';
        const world = context.world || {};
        const title = format(data().case?.title || context.plugin?.name || '秘密审判');
        const subtitle = format(data().case?.subtitle || data().setting?.name || '关系 · 线索 · 证据');
        const content = screen === 'abilities' ? renderAbilities() : screen === 'evidence' ? renderEvidenceScreen() : screen === 'trial' ? renderTrial() : renderScene();
        root.innerHTML = `<header class="masthead"><div><div class="eyebrow">EIDOS FIELD NOTE · PRIVATE CASE</div><h1>${escapeHtml(title)}</h1><p class="subtitle">${escapeHtml(subtitle)} · 关系、能力边界与证据</p></div><div class="world-mark">${escapeHtml(world.playerName || '玩家')} · ${escapeHtml(world.sceneName || '当前场景')}<strong>${escapeHtml(world.name || '未命名世界')}</strong></div></header>
          <section class="reading-strip"><div class="micro">正在发生</div><p>${escapeHtml(asText(context.reading?.displayedText).trim() || format(data().case?.opening || '世界里还没有新的正文。'))}</p>${button('advance', '', '继续世界叙事', 'quiet-button')}</section>
          <div class="layout"><div class="main-column"><section class="panel"><nav class="tabs" aria-label="审判调查区域">${screens.map(([id, label]) => `<button type="button" class="tab" data-action="screen" data-id="${id}" aria-current="${screen === id ? 'page' : 'false'}">${label}</button>`).join('')}</nav></section>${content}</div>
            <aside class="side-column"><section class="panel"><div class="panel-head"><h3>住客与关系</h3><span class="micro">SUSPICION ≠ VERDICT</span></div><div class="panel-body">${renderPeople()}<p class="footnote">把模组角色对应到导入世界的角色后，称呼会随你的存档保存。若能力设定不同，还要编辑模组数据里的能力描述和证词。</p></div></section>
              <section class="panel"><div class="panel-head"><h3>可调查的地点</h3><span class="evidence-count">${(state.foundClues || []).length} / ${(data().clues || []).length} 件已发现</span></div><div class="panel-body"><div class="clue-list">${renderClues()}</div></div></section>
              <section class="panel"><div class="panel-head"><h3>当前证词</h3><span class="micro">选择后出示证物</span></div><div class="panel-body"><div class="testimony-list">${list(data().testimonies || [], entry => `<article class="testimony-card ${state.selectedTestimony === entry.id ? 'is-selected' : ''}"><p class="speaker">${escapeHtml(personName(entry.personId))} · ${challenged(entry.id) ? '已核对' : '待核对'}</p><blockquote>「${escapeHtml(format(entry.text))}」</blockquote>${state.selectedTestimony === entry.id && !challenged(entry.id) ? `<div class="present-row">${(state.foundClues || []).map(id => clue(id)).filter(Boolean).map(item => button('present', item.id, `出示：${escapeHtml(format(item.title))}`)).join('') || '<span class="footnote">先找到证物，再回来质询。</span>'}</div>` : ''}${challenged(entry.id) ? `<p class="challenge-note">${escapeHtml(format(entry.challenge))}</p>` : button('testimony', entry.id, '质询这句话')}</article>`, '案卷中还没有证词。')}</div><p class="status-line" role="status">${escapeHtml(state.message || '选择证词并出示已发现的证物。')}</p></div></section>
            </aside></div>`;
      }
      function inspect(id) {
        const item = clue(id);
        if (!item || found(id)) return;
        if (window.Eidos?.gameplay?.perform) {
          pendingCommit = true; render();
          window.Eidos.gameplay.perform('discover-' + id, { narrate: false }).then(() => {
            pendingCommit = false; render();
          }).catch(error => { pendingCommit = false; state.message = error.message; render(); });
          return;
        }
        state.foundClues = [...(state.foundClues || []), id];
        state.screen = 'evidence';
        const note = `${format(item.title)}：${format(item.detail)}`;
        mark(`你把「${format(item.title)}」记入案卷。它可以支持一条事实，也可以推翻一个过强的判断。`, `调查${format(item.place || '宿舍')}：${note}`);
      }
      function selectTestimony(id) {
        const entry = testimony(id);
        if (!entry) return;
        state.selectedTestimony = id;
        state.screen = 'trial';
        state.message = `现在核对${personName(entry.personId)}的这句话。请选择已经发现、且与它直接相关的证物。`;
        sync();
        render();
      }
      function present(id) {
        const entry = testimony(state.selectedTestimony);
        const item = clue(id);
        if (!entry || !item || !found(id)) return;
        if (entry.challengeClue !== id) {
          mark(`「${format(item.title)}」目前不能直接证明或推翻这句话。可以保留它，再找更贴近的材料。`);
          return;
        }
        state.challengedStatements = [...new Set([...(state.challengedStatements || []), entry.id])];
        mark(format(entry.challenge || '这件证物与该证词形成了可核对的矛盾。'), `在审判中以「${format(item.title)}」质询${personName(entry.personId)}的证词`);
      }
      function attemptVerdict() {
        const resolution = data().resolution || {};
        const completeEvidence = Array.isArray(resolution.requiredEvidence) && resolution.requiredEvidence.every(found);
        const completeChallenge = challenged(resolution.requiredContradiction);
        if (!state.suspicion) {
          mark('先选择一个暂时怀疑的对象。怀疑只是调查方向，不会变成判决。');
          return;
        }
        if (!completeEvidence || !completeChallenge) {
          mark('证据还不能支持定罪。怀疑可以保留或改掉；你仍可继续调查，并把具体物证对应到具体证词。');
          return;
        }
        if (state.suspicion !== resolution.culpritId) {
          mark('怀疑不等于定罪：已提交的证据链与当前怀疑对象不一致。你可以修改怀疑，或继续检查现场。');
          return;
        }
        state.verdict = 'resolved';
        state.verdictFor = state.suspicion;
        state.screen = 'trial';
        state.message = '你提交了有证物、有证词矛盾的判断。结案记录不需要公开那封私信。';
        mark(state.message, `提交审判判断：根据已发现的灯芯与迟铃线、以及对应证词矛盾，认定${personName(state.verdictFor)}改动现场并造成致命火灾；不公开私信原句。`, true);
      }
      function choosePrivacy(choice) {
        if (state.verdict !== 'resolved') return;
        state.privacyChoice = choice;
        if (choice === 'anonymous') {
          mark('你只提交与证据链相关的匿名事实，没有复述林杳的私信原句。', '以匿名事实提交结案记录，保护私信内容', true);
        } else {
          mark('你选择公开原句。审判记录现在包含这段私人内容。', `应玩家明确选择，公开私信原句：${format(data().privateLetter?.text || '')}`, true);
        }
      }
      root.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target || pendingCommit) return;
        const action = target.dataset.action;
        const id = target.dataset.id || '';
        if (action === 'screen') { state.screen = id; sync(); render(); }
        else if (action === 'inspect') inspect(id);
        else if (action === 'testimony') selectTestimony(id);
        else if (action === 'present') present(id);
        else if (action === 'suspect') { state.suspicion = id; mark(`你暂时怀疑${personName(id)}。这不是判决，之后可以改。`, `暂时把${personName(id)}列为怀疑对象，继续调查`); }
        else if (action === 'convict') attemptVerdict();
        else if (action === 'protect-secret') choosePrivacy('anonymous');
        else if (action === 'publish-secret') choosePrivacy('quoted');
        else if (action === 'advance') { const last = state._eidosGameplay?.last; if (last && last.narration !== 'complete' && window.Eidos?.gameplay) window.Eidos.gameplay.narrate(last.id).catch(error => { state.message = error.message; render(); }); else window.Eidos?.advance?.(); }
        else if (action === 'daily') mark(`你记下了${personName(id)}的日常照料。关系能解释动机，却不能替代证据。`, `和${personName(id)}共度一段日常，记下照料习惯`);
      });
      root.addEventListener('change', event => {
        const select = event.target.closest('[data-bind]');
        if (!select) return;
        const id = select.dataset.bind;
        const value = select.value;
        state.bindings = { ...(state.bindings || {}) };
        if (value && value !== person(id)?.name) state.bindings[id] = value;
        else delete state.bindings[id];
        state.message = `${personName(id)}已对应到这个世界的角色；模组里的身份、关系与能力材料仍需按新世界设定核对。`;
        sync();
        render();
      });

      if (window.Eidos && window.Eidos.onContext) window.Eidos.onContext(nextContext => {
        context = nextContext || {};
        {
          const incoming = context.state && typeof context.state === 'object' ? context.state : {};
          state = { ...clone(freshState), ...clone(incoming) };
          state.foundClues = Array.isArray(state.foundClues) ? state.foundClues : [];
          state.challengedStatements = Array.isArray(state.challengedStatements) ? state.challengedStatements : [];
          state.bindings = state.bindings && typeof state.bindings === 'object' ? state.bindings : {};
          acceptedState = clone(state);
          if (!hydrated) { hydrated = true; sync(); }
        }
        render();
      });
    })();
  </script>
</body>
</html>
