<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#eee8db;color:#2b302e;font:16px/1.85 system-ui}main{max-width:900px;margin:auto;padding:28px 34px}header{border-bottom:1px solid #7f8e83;padding-bottom:12px}small{letter-spacing:.15em;color:#586a61}h1{font:30px/1.4 Georgia,serif;margin:8px 0}p{white-space:pre-wrap;margin:18px 0}.speaker{font-size:12px;color:#577565}button{cursor:pointer;background:#365c50;color:#fff;border:0;padding:10px 16px;margin:5px 8px 5px 0;font:inherit;font-size:14px}button:disabled{opacity:.5;cursor:default}.quiet{background:transparent;border:1px solid #8c9e95;color:#365c50}textarea{width:100%;padding:10px;background:#faf7ee;border:1px solid #a3afa8;font:inherit;font-size:14px}#error{color:#9b3530}#world{border-top:1px solid #abb4aa;margin-top:24px}footer{border-top:1px solid #abb4aa;padding-top:12px;margin-top:24px;font-size:12px;color:#586a61}
</style></head><body><main><header><small>旧港邮局 · 作者片段与自由即兴</small><h1 id="title">最后一班邮车</h1><div id="place"></div></header><article id="passage" aria-label="作者正文"></article><div id="choices"></div><div id="world" hidden><small>世界正文</small><article id="continuation"></article></div><p id="error" role="status"></p><button id="improvise" class="quiet">请 AI 写现场反应</button><textarea id="action" aria-label="自由行动" placeholder="也可以离开、追问，或做你自己的决定。"></textarea><button id="submit">自由行动</button><footer>作者原句和决定随世界线保存。AI 即兴会调用玩家配置的模型；离线实验室只记录请求。</footer></main><script src="logic.js"></script><script>
let context, busy=false;
const el=id=>document.getElementById(id), state=()=>context?.state||{};
function paragraphs(target,segments){target.replaceChildren();for(const s of segments){const p=document.createElement('p');if(s.speaker){const speaker=document.createElement('span');speaker.className='speaker';speaker.textContent=s.speaker+'　';p.append(speaker)}p.append(document.createTextNode(s.text));target.append(p)}}
function render(){if(!context)return;const story=context.plugin.data.story,s=state();el('title').textContent=story.title;el('place').textContent=context.world.sceneName+' / '+(s.resolution?'这一段已收束，仍可继续行动':'邮局尚未落锁');const authored=story.passages[s.passage||'arrival'];paragraphs(el('passage'),authored.segments);el('choices').replaceChildren();
 const choices=s.resolution?[]:!s.started?[['begin','走进邮局']]:[...(!s.examined?[['inspect','读一读信']]:[]),['send','交给白槿代寄'],['hold','暂时保留这封信']];
 for(const [action,label] of choices){const button=document.createElement('button');button.textContent=label;button.disabled=busy||context.reading.loading;button.onclick=()=>choose(action);el('choices').append(button)}
 const lines=context.reading.segments||[],own=authored.segments.map(s=>s.text).join('');const extra=lines.length&&lines.map(s=>s.text).join('')!==own;el('world').hidden=!extra;if(extra)paragraphs(el('continuation'),lines);
 el('improvise').disabled=el('submit').disabled=busy||context.reading.loading;
}
async function choose(action){if(busy)return;busy=true;el('error').textContent='';render();try{const result=await Eidos.gameplay.commit(LastPost.decide(context.plugin.data.story,state(),action));if(result.persistence==='pending')el('error').textContent='决定已接受，请先重试本地保存。'}catch(e){el('error').textContent=e.message}finally{busy=false;render()}}
Eidos.onContext(c=>{context=c;render()});
el('improvise').onclick=async()=>{try{const last=state()._eidosGameplay?.last;if(last)await Eidos.gameplay.narrate(last.id);else Eidos.narrate({kind:'continue'});}catch(e){el('error').textContent=e.message}};
el('submit').onclick=()=>{const action=el('action').value.trim();if(action){Eidos.submit(action);el('action').value=''}};
</script></body></html>
