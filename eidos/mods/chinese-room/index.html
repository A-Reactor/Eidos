<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light;--paper:var(--eidos-paper,#fafafa);--ink:var(--eidos-ink,#191919);--accent:var(--eidos-accent,#9e0000);--font:var(--font-geist-sans,ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif)}
*{box-sizing:border-box}html,body,main{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--paper);color:var(--ink);font:1rem var(--font)}main{display:grid;place-items:center;padding:clamp(4px,1vw,14px);outline:none;touch-action:manipulation}#board{display:grid;max-width:100%;max-height:100%;user-select:none;outline:none;background:color-mix(in srgb,var(--ink) 3%,var(--paper))}button{appearance:none;aspect-ratio:1;padding:0;border:0;border-radius:1px;background:transparent;color:var(--ink);font:500 var(--map-glyph-size,1.25rem)/1 var(--font);min-width:0;min-height:0;position:relative;cursor:pointer}button:focus-visible{outline:1px solid var(--accent);outline-offset:-1px;z-index:1}.ground{color:color-mix(in srgb,var(--ink) 28%,var(--paper))}.terrain{font-size:calc(var(--map-glyph-size,1.25rem) * .82);color:color-mix(in srgb,var(--ink) 45%,var(--paper));background:color-mix(in srgb,var(--ink) 4%,var(--paper))}.npc{color:var(--accent)}.exit{box-shadow:inset 0 -1px color-mix(in srgb,var(--ink) 25%,var(--paper))}.exit[data-blocked="true"]{opacity:.45;box-shadow:inset 0 -1px currentColor}.near{box-shadow:inset 0 -2px color-mix(in srgb,var(--accent) 60%,transparent)}.player{background:var(--ink);color:var(--paper)}.player:after{content:"";position:absolute;background:var(--accent);width:4px;height:4px;left:calc(50% - 2px);bottom:1px}.player[data-facing="up"]:after{top:1px;bottom:auto}.player[data-facing="left"]:after{left:1px;top:calc(50% - 2px);bottom:auto}.player[data-facing="right"]:after{right:1px;left:auto;top:calc(50% - 2px);bottom:auto}#board[aria-busy="true"]{outline:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main id="map-surface" tabindex="0" aria-label="地点地图，方向键移动，确认键交互"><div id="board" role="group" aria-label="文字地图"></div></main><script src="protocol.js"></script><script src="engine.js"></script><script src="map-design.js"></script><script src="generation.js"></script><script src="view.js"></script><script src="ui.js"></script></body></html>
